[package]
name = "hxr-picker"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
description = "One fzf picker for every coding-agent CLI: list and resume sessions from opencode, Claude Code, Codex, pi, omp, Qwen Code, Kimi and reasonix"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stondo/hxr"
readme = "README.md"
keywords = ["cli", "fzf", "agent", "sessions"]
categories = ["command-line-utilities"]

# crates.io name `hxr` is taken by an unrelated (dormant) HTTP CLI; the
# package publishes as hxr-picker while the installed command stays `hxr`.
[[bin]]
name = "hxr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal_size = "0.4.4"

[profile.release]
lto = "thin"
strip = true
